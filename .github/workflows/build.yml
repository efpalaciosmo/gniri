name: Build and publish Gniri

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'release-evidence/**']
  schedule:
    # Publish ahead of the workstation's Sunday update window (UTC here).
    - cron: '20 6 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install required validators
        run: bash scripts/install-ci-checks.sh
      - name: Static checks
        run: GNIRI_STRICT_CHECKS=1 make check
      - name: Free disk space for the OS image
        run: |
          df -h /
          # Hosted SDKs are unused; image builds and rechunking need this space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h /
      - name: Set image names
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/gniri" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          reference=localhost/gniri:development
          if [[ $PUBLISH == true ]]; then
            test -s trust/cosign.pub
            reference="$IMAGE:stable"
          fi
          sudo python3 scripts/build-image.py localhost/gniri:build --reference "$reference" \
            --source "$SOURCE" --revision "$GITHUB_SHA" --fresh
          sudo python3 scripts/rechunk-image.py localhost/gniri:build
      - name: Desktop and offline Flatpak regressions
        run: |
          sudo make check-desktop IMAGE=localhost/gniri:build
          sudo podman run --rm --network=none --entrypoint bash \
            -v "$PWD/tests/flatpak-smoke.sh:/run/flatpak-smoke.sh:ro" \
            localhost/gniri:build /run/flatpak-smoke.sh
      - name: Export package and launcher inventory
        run: |
          mkdir -p output/inventory
          container=$(sudo podman create localhost/gniri:build)
          sudo podman cp "$container:/usr/share/gniri/packages.txt" output/inventory/
          sudo podman cp "$container:/usr/share/gniri/desktop-entries.txt" output/inventory/
          sudo podman cp "$container:/usr/share/gniri/visible-applications.txt" output/inventory/
          sudo podman cp "$container:/usr/share/gniri/build.json" output/inventory/
          sudo podman rm "$container"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          cosign-release: v3.1.3
      - name: Publish signed candidate (never promote stable here)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY"
          test -n "$COSIGN_PASSWORD"
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          revision="$IMAGE:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo podman push --digestfile output/digest localhost/gniri:build "$revision"
          digest=$(cat output/digest)
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --registry-referrers-mode=legacy --key env://COSIGN_PRIVATE_KEY "$IMAGE@$digest"
          cosign verify --new-bundle-format=false --key trust/cosign.pub "$IMAGE@$digest"
          # Exercise the real precheck offline, then signed/negative registry fixtures.
          sudo podman run --rm --network=none --entrypoint python3 \
            -v "$PWD/tests/bootc-policy-smoke.py:/run/bootc-policy-smoke.py:ro" \
            localhost/gniri:build /run/bootc-policy-smoke.py
          bash scripts/check-registry-policy.sh localhost/gniri:build "$IMAGE" "$digest"
          python3 scripts/release-gate.py template --digest "$digest" --revision "$GITHUB_SHA" \
            --output output/inventory/validation.json
          cp output/digest output/inventory/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gniri-candidate-inventory
          path: output/inventory/
