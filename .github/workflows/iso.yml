name: Build installer ISO

on:
  workflow_dispatch:
    inputs:
      payload_digest:
        description: Signed candidate sha256 digest (empty selects current stable)
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: installer-iso
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install required validators
        run: bash scripts/install-ci-checks.sh
      - name: Static checks
        run: GNIRI_STRICT_CHECKS=1 make check
      - name: Free disk space for the installer ISO
        run: |
          df -h /
          # Hosted SDKs are unused; payload, installer layers and osbuild need this space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
            /usr/share/swift /usr/lib/jvm /usr/local/share/powershell
          df -h /
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Resolve and verify payload, then build ISO
        env:
          OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
        run: |
          image="ghcr.io/${OWNER,,}/gniri"
          test -s trust/cosign.pub
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$PAYLOAD_DIGEST"
          if [[ -z $digest ]]; then
            digest=$(sudo skopeo inspect --format '{{.Digest}}' "docker://$image:stable")
          fi
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign verify --new-bundle-format=false --key trust/cosign.pub "$image@$digest"
          sudo env "PATH=$PATH" bash scripts/build-iso.sh "$image@$digest" "$image:stable" '' 1
          sudo chown -R "$(id -u):$(id -g)" output/iso
          cd output/iso
          sha256sum --check SHA256SUMS
      - name: Real installer mount and finalization regressions
        run: sudo make check-installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gniri-installer-x86_64
          path: |
            output/iso/gniri-x86_64.iso
            output/iso/SHA256SUMS
            output/iso/build.json
          compression-level: 0
          retention-days: 30
