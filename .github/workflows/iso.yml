name: Build installer ISO

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Installed update channel (latest is for candidate testing)
        required: true
        default: stable
        type: choice
        options:
          - stable
          - latest
      digest:
        description: Optional signed sha256 payload digest; blank resolves the selected channel
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: iso-${{ github.ref }}-${{ inputs.channel }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install required validators
        run: bash scripts/install-ci-checks.sh
      - name: Static checks
        run: GNIRI_STRICT_CHECKS=1 make check
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Authenticate registry reads
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | sudo env "PATH=$PATH" cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Resolve installer payload
        id: payload
        env:
          OWNER: ${{ github.repository_owner }}
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ $CHANNEL == stable || $CHANNEL == latest ]]
          image="ghcr.io/${OWNER,,}/gniri"
          target="$image:$CHANNEL"
          digest=$REQUESTED_DIGEST
          if [[ -z $digest ]]; then
            digest=$(sudo skopeo inspect --format '{{.Digest}}' "docker://$target")
          fi
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          payload="$image@$digest"
          sudo env "PATH=$PATH" cosign verify --new-bundle-format=false --key trust/cosign.pub "$payload" >/dev/null
          echo "payload=$payload" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Free disk space for the installer
        run: |
          df -h /
          # Hosted SDKs are unused; payload staging and osbuild need this space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h /
      - name: Build ISO from the verified digest
        env:
          PAYLOAD_REF: ${{ steps.payload.outputs.payload }}
          TARGET_REF: ${{ steps.payload.outputs.target }}
        run: sudo env "PATH=$PATH" bash scripts/build-iso.sh "$PAYLOAD_REF" "$TARGET_REF" '' 1
      - name: Installer mount and finalizer regressions
        run: sudo make check-installer
      - name: Verify ISO checksum
        working-directory: output/iso
        run: sha256sum --check SHA256SUMS
      - name: Upload installer ISO
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gniri-iso-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/iso/gniri-x86_64.iso
            output/iso/SHA256SUMS
            output/iso/build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Download instructions
        env:
          PAYLOAD_REF: ${{ steps.payload.outputs.payload }}
          TARGET_REF: ${{ steps.payload.outputs.target }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            printf '### Installer ISO\n\n[Download ISO artifact](%s) (retained for 7 days).\n\n' "$ARTIFACT_URL"
            printf 'Payload: **%s**\n\nInstalled update origin: **%s**\n\n' "$PAYLOAD_REF" "$TARGET_REF"
            printf 'Extract the artifact, then verify its checksum before writing the ISO:\n\n    sha256sum --check SHA256SUMS\n\n'
            printf 'This run does not promote stable or certify VM, hardware, or Secure Boot readiness.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ISO build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gniri-iso-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/iso-build.log
          if-no-files-found: ignore
          retention-days: 7
