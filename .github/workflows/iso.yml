name: Build and publish image

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'release-evidence/**']
  schedule:
    # Saturday 05:00 America/Bogota (UTC-5).
    - cron: '0 10 * * 6'
  workflow_dispatch:
    inputs:
      build_iso:
        description: 'Also build an installer ISO for release validation'
        required: false
        default: false
        type: boolean
      evidence:
        description: 'Optional: committed release-evidence/name.json to promote a tested ISO instead of building'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}-${{ inputs.evidence != '' && 'promotion' || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: inputs.evidence == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install required validators
        run: bash scripts/install-ci-checks.sh
      - name: Static checks
        run: GNIRI_STRICT_CHECKS=1 make check
      - name: Free disk space for the OS image
        run: |
          df -h /
          # Hosted SDKs are unused; image builds and rechunking need this space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h /
      - name: Set image names
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/gniri" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          reference=localhost/gniri:development
          if [[ $PUBLISH == true ]]; then
            test -s trust/cosign.pub
            reference="$IMAGE:stable"
          fi
          sudo python3 scripts/build-image.py localhost/gniri:build --reference "$reference" \
            --source "$SOURCE" --revision "$GITHUB_SHA" --fresh
          sudo python3 scripts/rechunk-image.py localhost/gniri:build \
            --report output/inventory/image-size.json
          sudo chown -R "$(id -u):$(id -g)" output/inventory
      - name: Desktop and offline Flatpak regressions
        run: |
          sudo make check-desktop CHECKED=1 IMAGE=localhost/gniri:build
          sudo podman run --rm --network=none --entrypoint bash \
            -v "$PWD/tests/flatpak-smoke.sh:/run/flatpak-smoke.sh:ro" \
            localhost/gniri:build /run/flatpak-smoke.sh
      - name: Offline signature transport regression
        run: |
          sudo podman run --rm --network=none --entrypoint python3 \
            -v "$PWD:/src:ro" \
            localhost/gniri:build /src/tests/signature-transport-smoke.py
      - name: Export package and launcher inventory
        run: |
          mkdir -p output/inventory
          container=$(sudo podman create localhost/gniri:build)
          sudo podman cp "$container:/usr/share/gniri/packages.txt" output/inventory/
          sudo podman cp "$container:/usr/share/gniri/desktop-entries.txt" output/inventory/
          sudo podman cp "$container:/usr/share/gniri/visible-applications.txt" output/inventory/
          sudo podman cp "$container:/usr/share/gniri/build.json" output/inventory/
          sudo podman rm "$container"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          cosign-release: v3.1.3
      - name: Publish signed candidate (never promote stable here)
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY"
          test -n "$COSIGN_PASSWORD"
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          revision="$IMAGE:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo podman push --digestfile output/digest localhost/gniri:build "$revision"
          digest=$(cat output/digest)
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --registry-referrers-mode=legacy --key env://COSIGN_PRIVATE_KEY "$IMAGE@$digest"
          cosign verify --new-bundle-format=false --key trust/cosign.pub "$IMAGE@$digest"
          # Exercise the real precheck offline, then signed/negative registry fixtures.
          sudo podman run --rm --network=none --entrypoint python3 \
            -v "$PWD/tests/bootc-policy-smoke.py:/run/bootc-policy-smoke.py:ro" \
            localhost/gniri:build /run/bootc-policy-smoke.py
          bash scripts/check-registry-policy.sh localhost/gniri:build "$IMAGE" "$digest"
          python3 scripts/release-gate.py template --digest "$digest" --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output output/inventory/validation.json
          cp output/digest output/inventory/
          # Update the convenient pull tag only after signing and all regressions.
          # Copy the manifest unchanged so the signature remains bound to its digest.
          sudo skopeo copy --all --preserve-digests "docker://$IMAGE@$digest" "docker://$IMAGE:latest"
          actual=$(sudo skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:latest")
          test "$actual" = "$digest"
          cosign verify --new-bundle-format=false --key trust/cosign.pub "$IMAGE@$actual"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '### Signed image\n\n    docker pull %s:latest\n\nDigest: %s@%s\n\nSaturday 05:00 America/Bogota. The stable release channel requires reviewed evidence.\n' \
            "$IMAGE" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('output/inventory/image-size.json').read_text())
          print(f"\nCompressed layers: {report['result_layer_bytes_gzip'] / 1024**3:.2f} GiB")
          print(f"\nUncompressed image: {report['result_size_bytes_podman'] / 1024**3:.2f} GiB")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gniri-candidate-inventory-${{ github.run_attempt }}
          path: output/inventory/
          retention-days: 30

  iso:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso && github.ref == 'refs/heads/main' && needs.build.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install required validators
        run: bash scripts/install-ci-checks.sh
      - name: Free disk space for the installer ISO
        run: |
          df -h /
          # Hosted SDKs are unused; payload, installer layers and osbuild need this space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
            /usr/share/swift /usr/lib/jvm /usr/local/share/powershell
          df -h /
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Resolve and verify payload, then build ISO
        env:
          OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          image="ghcr.io/${OWNER,,}/gniri"
          test -s trust/cosign.pub
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$PAYLOAD_DIGEST"
          cosign verify --new-bundle-format=false --key trust/cosign.pub "$image@$digest"
          sudo env "PATH=$PATH" "DOCKER_CONFIG=$HOME/.docker" \
            bash scripts/build-iso.sh "$image@$digest" "$image:stable" '' 0
          sudo chown -R "$(id -u):$(id -g)" output/iso
          cd output/iso
          sha256sum --check SHA256SUMS
      - name: Real installer mount and finalization regressions
        run: sudo make check-installer
      - name: Record candidate identity for human validation
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          digest=$(jq -er .payload_reference output/iso/build.json)
          digest=${digest##*@}
          revision=$(jq -er .source_revision output/iso/build.json)
          checksum=$(cut -d ' ' -f 1 output/iso/SHA256SUMS)
          python3 scripts/release-gate.py template --digest "$digest" --revision "$revision" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --iso-sha256 "$checksum" \
            --output output/iso/validation.json
          printf '### Installer candidate (not a release)\n\nPayload: ghcr.io/%s/gniri@%s\n\nISO SHA-256: %s\n\nDownload gniri-installer-x86_64-%s from this run. Complete its validation.json with real test evidence before promotion.\n' \
            "${OWNER,,}" "$digest" "$checksum" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gniri-installer-x86_64-${{ github.run_attempt }}
          path: |
            output/iso/gniri-x86_64.iso
            output/iso/SHA256SUMS
            output/iso/build.json
            output/iso/validation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve ISO builder logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gniri-iso-logs-${{ github.run_attempt }}
          path: output/iso-build.log
          if-no-files-found: ignore
          retention-days: 30

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # scripts/setup-github.py configures the required reviewer and main-only policy.
    environment: stable
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install required validators
        run: bash scripts/install-ci-checks.sh
      - name: Static checks
        run: GNIRI_STRICT_CHECKS=1 make check
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Validate committed review
        id: review
        env:
          EVIDENCE: ${{ inputs.evidence }}
        run: |
          set -euo pipefail
          [[ $EVIDENCE =~ ^release-evidence/[a-zA-Z0-9_-]+\.json$ ]]
          digest=$(jq -er .payload_digest "$EVIDENCE")
          revision=$(jq -er .source_revision "$EVIDENCE")
          python3 scripts/release-gate.py validate --digest "$digest" --revision "$revision" --output "$EVIDENCE"
          run_id=$(jq -er '.candidate_run_id | tostring' "$EVIDENCE")
          run_attempt=$(jq -er '.candidate_run_attempt | tostring' "$EVIDENCE")
          {
            echo "digest=$digest"
            echo "revision=$revision"
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
          } >> "$GITHUB_OUTPUT"
      - name: Download and bind the tested ISO to the review
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.review.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.review.outputs.run_attempt }}
          EVIDENCE: ${{ inputs.evidence }}
        run: |
          # The downloaded ISO and release-sized parts coexist on this runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h /
          mkdir -p output
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > output/approved-run.json
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "gniri-installer-x86_64-$RUN_ATTEMPT" --dir output/reviewed-iso
          tag=$(python3 scripts/prepare-release.py --artifacts output/reviewed-iso --output output/release \
            --evidence "$EVIDENCE" --run output/approved-run.json --repository "$GITHUB_REPOSITORY")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify signed payload and public update access
        env:
          OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.review.outputs.digest }}
          REVISION: ${{ steps.review.outputs.revision }}
        run: |
          image="ghcr.io/${OWNER,,}/gniri"
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign verify --new-bundle-format=false --key trust/cosign.pub "$image@$DIGEST"
          actual=$(sudo skopeo inspect --format '{{ index .Labels "org.opencontainers.image.revision" }}' "docker://$image@$DIGEST")
          test "$actual" = "$REVISION"
          # Installed machines must update without a GitHub token.
          skopeo inspect --no-creds "docker://$image@$DIGEST" >/dev/null
      - name: Sign and verify the release checksum manifest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY"
          test -n "$COSIGN_PASSWORD"
          cosign sign-blob --yes --use-signing-config=false --key env://COSIGN_PRIVATE_KEY \
            --bundle output/release/SHA256SUMS.bundle output/release/SHA256SUMS
          cosign verify-blob --key trust/cosign.pub --bundle output/release/SHA256SUMS.bundle output/release/SHA256SUMS
      - name: Stage a draft release before changing stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          REVISION: ${{ steps.review.outputs.revision }}
        run: bash scripts/stage-github-release.sh "$TAG" "$REVISION" output/release
      - name: Promote the exact signed digest without rebuilding
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.review.outputs.digest }}
        run: |
          image="ghcr.io/${OWNER,,}/gniri"
          sudo skopeo copy --all --preserve-digests "docker://$image@$DIGEST" "docker://$image:stable"
          actual=$(sudo skopeo inspect --format '{{.Digest}}' "docker://$image:stable")
          test "$actual" = "$DIGEST"
          cosign verify --new-bundle-format=false --key trust/cosign.pub "$image@$actual"
      - name: Publish the reviewed GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          printf '### Stable release\n\nhttps://github.com/%s/releases/tag/%s\n' \
            "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
