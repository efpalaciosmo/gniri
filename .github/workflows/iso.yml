name: Build installer ISO

on:
  workflow_call:
    inputs:
      payload_digest:
        description: Exact signed candidate digest from the successful image job
        required: true
        type: string
  workflow_dispatch:
    inputs:
      payload_digest:
        description: Exact signed candidate sha256 digest from Build and publish Gniri
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: installer-iso-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  iso:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate candidate digest
        env:
          PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
        run: |
          if [[ ! $PAYLOAD_DIGEST =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Provide payload_digest from Build and publish Gniri. Run that workflow first to create a current signed candidate; stable may still contain a legacy image without resolved base metadata.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install required validators
        run: bash scripts/install-ci-checks.sh
      - name: Static checks
        run: GNIRI_STRICT_CHECKS=1 make check
      - name: Free disk space for the installer ISO
        run: |
          df -h /
          # Hosted SDKs are unused; payload, installer layers and osbuild need this space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
            /usr/share/swift /usr/lib/jvm /usr/local/share/powershell
          df -h /
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Resolve and verify payload, then build ISO
        env:
          OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
        run: |
          image="ghcr.io/${OWNER,,}/gniri"
          test -s trust/cosign.pub
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$PAYLOAD_DIGEST"
          cosign verify --new-bundle-format=false --key trust/cosign.pub "$image@$digest"
          sudo env "PATH=$PATH" "DOCKER_CONFIG=$HOME/.docker" \
            bash scripts/build-iso.sh "$image@$digest" "$image:stable" '' 1
          sudo chown -R "$(id -u):$(id -g)" output/iso
          cd output/iso
          sha256sum --check SHA256SUMS
      - name: Real installer mount and finalization regressions
        run: sudo make check-installer
      - name: Record candidate identity for human validation
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          digest=$(jq -er .payload_reference output/iso/build.json)
          digest=${digest##*@}
          revision=$(jq -er .source_revision output/iso/build.json)
          checksum=$(cut -d ' ' -f 1 output/iso/SHA256SUMS)
          python3 scripts/release-gate.py template --digest "$digest" --revision "$revision" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --iso-sha256 "$checksum" \
            --output output/iso/validation.json
          printf '### Installer candidate (not a release)\n\nPayload: ghcr.io/%s/gniri@%s\n\nISO SHA-256: %s\n\nDownload gniri-installer-x86_64-%s from this run. Complete its validation.json with real test evidence before promotion.\n' \
            "${OWNER,,}" "$digest" "$checksum" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gniri-installer-x86_64-${{ github.run_attempt }}
          path: |
            output/iso/gniri-x86_64.iso
            output/iso/SHA256SUMS
            output/iso/build.json
            output/iso/validation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve ISO builder logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gniri-iso-logs-${{ github.run_attempt }}
          path: output/iso-build.log
          if-no-files-found: ignore
          retention-days: 30
