name: Promote tested candidate to stable

on:
  workflow_dispatch:
    inputs:
      evidence:
        description: Committed release-evidence/name.json with reviewed results and log URLs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # scripts/setup-github.py configures the required reviewer and main-only policy.
    environment: stable
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install required validators
        run: bash scripts/install-ci-checks.sh
      - name: Static checks
        run: GNIRI_STRICT_CHECKS=1 make check
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Validate committed review
        id: review
        env:
          EVIDENCE: ${{ inputs.evidence }}
        run: |
          set -euo pipefail
          [[ $EVIDENCE =~ ^release-evidence/[a-zA-Z0-9_-]+\.json$ ]]
          digest=$(jq -er .payload_digest "$EVIDENCE")
          revision=$(jq -er .source_revision "$EVIDENCE")
          python3 scripts/release-gate.py validate --digest "$digest" --revision "$revision" --output "$EVIDENCE"
          run_id=$(jq -er '.candidate_run_id | tostring' "$EVIDENCE")
          run_attempt=$(jq -er '.candidate_run_attempt | tostring' "$EVIDENCE")
          {
            echo "digest=$digest"
            echo "revision=$revision"
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
          } >> "$GITHUB_OUTPUT"
      - name: Download and bind the tested ISO to the review
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.review.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.review.outputs.run_attempt }}
          EVIDENCE: ${{ inputs.evidence }}
        run: |
          # The downloaded ISO and release-sized parts coexist on this runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h /
          mkdir -p output
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > output/approved-run.json
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "gniri-installer-x86_64-$RUN_ATTEMPT" --dir output/reviewed-iso
          tag=$(python3 scripts/prepare-release.py --artifacts output/reviewed-iso --output output/release \
            --evidence "$EVIDENCE" --run output/approved-run.json --repository "$GITHUB_REPOSITORY")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify signed payload and public update access
        env:
          OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.review.outputs.digest }}
          REVISION: ${{ steps.review.outputs.revision }}
        run: |
          image="ghcr.io/${OWNER,,}/gniri"
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign verify --new-bundle-format=false --key trust/cosign.pub "$image@$DIGEST"
          actual=$(sudo skopeo inspect --format '{{ index .Labels "org.opencontainers.image.revision" }}' "docker://$image@$DIGEST")
          test "$actual" = "$REVISION"
          # Installed machines must update without a GitHub token.
          skopeo inspect --no-creds "docker://$image@$DIGEST" >/dev/null
      - name: Sign and verify the release checksum manifest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY"
          test -n "$COSIGN_PASSWORD"
          cosign sign-blob --yes --use-signing-config=false --key env://COSIGN_PRIVATE_KEY \
            --bundle output/release/SHA256SUMS.bundle output/release/SHA256SUMS
          cosign verify-blob --key trust/cosign.pub --bundle output/release/SHA256SUMS.bundle output/release/SHA256SUMS
      - name: Stage a draft release before changing stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          REVISION: ${{ steps.review.outputs.revision }}
        run: bash scripts/stage-github-release.sh "$TAG" "$REVISION" output/release
      - name: Promote the exact signed digest without rebuilding
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.review.outputs.digest }}
        run: |
          image="ghcr.io/${OWNER,,}/gniri"
          sudo skopeo copy --all --preserve-digests "docker://$image@$DIGEST" "docker://$image:stable"
          actual=$(sudo skopeo inspect --format '{{.Digest}}' "docker://$image:stable")
          test "$actual" = "$DIGEST"
          cosign verify --new-bundle-format=false --key trust/cosign.pub "$image@$actual"
      - name: Publish the reviewed GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          printf '### Stable release\n\nhttps://github.com/%s/releases/tag/%s\n' \
            "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
